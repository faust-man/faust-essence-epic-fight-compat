plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.49-beta' }
version = '1.6.0'
group = 'com.faust.epiccompat'
base.archivesName = 'faust-epic-fight-compat-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.create('runtimeChecks')
sourceSets.runtimeChecks {
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
repositories {
    mavenCentral()
    maven { url='https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
neoForge {
    version = '21.1.219'
    parchment { minecraftVersion='1.21'; mappingsVersion='2024.11.10' }
    runs { client { client() }; server { server(); programArguments.add '--nogui'; if(project.hasProperty('runtimeChecks'))programArguments.addAll '--port','0' } }
    mods { faust_epic_compat { sourceSet sourceSets.main; if(project.hasProperty('runtimeChecks'))sourceSet sourceSets.runtimeChecks } }
}
dependencies {
    testRuntimeOnly files('../core/stamina/build/libs/fauststamina-neoforge-1.21.1-1.6.0.jar')
    testImplementation 'com.google.code.gson:gson:2.10.1'
    implementation 'maven.modrinth:epic-fight:8HHhJt6i'
    if(project.hasProperty('withStamina')) runtimeOnly files('../core/stamina/build/libs/fauststamina-neoforge-1.21.1-1.6.0.jar')
    implementation files('../core/neoforge/build/libs/faustcore-neoforge-1.21.1-1.6.0.jar')
}
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}
tasks.register('rulesTest',JavaExec) {
    dependsOn testClasses
    classpath=sourceSets.test.runtimeClasspath
    mainClass='com.faust.epiccompat.RulesTest'
}
tasks.named('test') { dependsOn rulesTest }


tasks.register('withoutStaminaTest',JavaExec) {
    dependsOn testClasses
    classpath=sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('fauststamina-') }
    mainClass='com.faust.epiccompat.WithoutStaminaTest'
}
tasks.named('test') { dependsOn withoutStaminaTest }
